<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мои дашборды</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #f4f4f4;
            margin: 0;
        }
        h1 { margin-bottom: 30px; }
        .button-container {
            display: flex;
            gap: 20px;
        }
        .btn {
            padding: 15px 30px;
            font-size: 18px;
            color: white;
            background-color: #2ea44f; /* Зеленый цвет GitHub */
            text-decoration: none;
            border-radius: 6px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: background-color 0.2s;
        }
        .btn:hover { background-color: #2c974b; }
    </style>
</head>
<body>
    <h1>Выберите дашборд</h1>
    <div class="button-container">
        <a href="dashboard1.html" class="btn">Дашборд 1</a>
        <a href="dashboard2.html" class="btn">Дашборд 2</a>
    </div>
</body>
</html>
