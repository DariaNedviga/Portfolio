<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мои дашборды</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background-color: #f4f4f4; }
        .tabs { display: flex; gap: 10px; margin-bottom: 15px; justify-content: center; }
        .tab-btn {
            padding: 10px 20px; font-size: 16px; cursor: pointer; border: none;
            background-color: #e0e0e0; border-radius: 5px; transition: 0.2s;
        }
        .tab-btn.active { background-color: #2ea44f; color: white; }
        iframe { width: 100%; height: 75vh; border: none; border-radius: 8px; background: white; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
    </style>
</head>
<body>
    <div class="tabs">
        <button class="tab-btn active" onclick="changeDash(1, this)">Дашборд 1</button>
        <button class="tab-btn" onclick="changeDash(2, this)">Дашборд 2</button>
    </div>

    <iframe id="dashFrame" src="ССЫЛКА_НА_ПЕРВЫЙ_ДАШБОРД"></iframe>

    <script>
        const dashboards = {
            1: "https://datalens.yandex/hvkzxbmjwt3q1?_share_link=public",
            2: "https://datalens.yandex/v8e7bn4be20qf?_share_link=public"
        };

        function changeDash(num, btnElement) {
            // Меняем ссылку в iframe
            document.getElementById('dashFrame').src = dashboards[num];
            
            // Меняем активную кнопку
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            btnElement.classList.add('active');
        }
    </script>
</body>
</html>
